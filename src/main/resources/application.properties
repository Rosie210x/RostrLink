spring.application.name=RostrLink

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rostrlink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rostrlink}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rostrlink123}
spring.datasource.driver-class-name=org.postgresql.Driver

app.security.enabled=true
spring.messages.encoding=UTF-8
spring.messages.basename=messages

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Session (server-side via Redis)
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.timeout=3600s

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# App custom settings
app.security.session.ttl-seconds=3600
app.security.session.kiosk-ttl-seconds=28800
app.security.login.max-attempts=5
app.security.login.lockout-minutes=15
app.security.otp.ttl-minutes=10
app.security.otp.max-sends-per-hour=3