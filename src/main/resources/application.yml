aws:
  region: ap-southeast-1
  s3:
    bucket: rostrlink-avatars-dev
    cloudfront-base-url: https://dxxxxx.cloudfront.net
  ses:
    from: no-reply@yourdomain.com

spring:
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025        # MailHog SMTP
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
# Optional: localstack for dev
localstack:
  enabled: false
  endpoint: http://localhost:4566
