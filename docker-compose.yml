version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: rostrlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rostrlink}
      POSTGRES_USER: ${POSTGRES_USER:-rostrlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rostrlink123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rostrlink} -d ${POSTGRES_DB:-rostrlink}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: rostrlink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: rostrlink-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rostrlink-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rostrlink}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rostrlink}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rostrlink123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "8080:8080"

volumes:
  postgres_data: