spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rostrlink}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:8888}
    driver-class-name: org.postgresql.Driver
  profiles:
    active: dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  session:
    store-type: redis
    redis:
      flush-mode: on_save
    timeout: 3600s

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: true

  messages:
    encoding: UTF-8
    basename: messages

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  security:
    enabled: true
    session:
      ttl-seconds: 3600
      kiosk-ttl-seconds: 28800
    login:
      max-attempts: 5
      lockout-minutes: 15
      rate-limit-window-seconds: 60
      rate-limit-ip-max: 5  # chặn sau 5 requests
    otp:
      ttl-minutes: 10
      max-sends-per-hour: 100

aws:
  region: ap-southeast-1
  s3:
    bucket: rostrlink-avatars-dev
    cloudfront-base-url: https://dxxxxx.cloudfront.net
  ses:
    from: no-reply@yourdomain.com

localstack:
  enabled: false
  endpoint: http://localhost:4566